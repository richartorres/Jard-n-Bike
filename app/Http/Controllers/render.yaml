services:
  - type: web
    name: jardin-bike-backend
    env: docker
    plan: free
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true # Ponlo en false cuando ya verifiques que cargue bien
      - key: LOG_CHANNEL
        value: stderr